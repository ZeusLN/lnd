# Minimal LND Configuration for Electrum Backend on Testnet
# This is a minimal configuration file focusing only on the essential settings

[Application Options]
# Basic LND settings
datadir=~/.lnd-electrum
rpclisten=127.0.0.1:10009
restlisten=127.0.0.1:8080
debuglevel=debug

# Electrum server configuration
electrum.server=electrum.blockstream.info:50001
electrum.tls=false
electrum.validateservercert=false
electrum.connecttimeout=30s
electrum.requesttimeout=30s

# Bitcoin chain configuration
[Bitcoin]
bitcoin.node=electrum
bitcoin.mainnet=true
